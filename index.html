<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Flakon leaderboard</title>

<style>
body{
  margin:0; font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex; justify-content:center; align-items:flex-start;
  gap:60px; padding-top:40px; color:#fff;
}

.leaderboard{
  width:650px;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

.leaderboard h2{
  text-align:center;
  font-size:32px;
  font-weight:800;
  text-shadow:2px 2px 6px #000;
  margin:0 0 15px 0;
}

.score-header{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px;
  gap:10px;
  padding-right:14px;
  margin-bottom:8px;
}

.header-item{
  text-align:center;
  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
  color:rgba(255,255,255,0.7);
}

#leaderboard-content{
  display:flex;
  flex-direction:column;
}

/* 🔥 FIXED ROW (NEM CSÚSZIK SZÉT) */
.row{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px;
  align-items:center;

  background:rgba(0,0,0,.4);
  padding:10px 14px;
  border-radius:18px;
  margin:6px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.name-container{
  display:flex;
  align-items:center;
  gap:10px;
}

.name{
  font-size:18px;
  font-weight:800;
}

/* 🏆 kupák */
.cup-badge{
  font-size:12px;
  padding:3px 8px;
  border-radius:8px;
  border:2px solid rgba(255,255,255,0.4);
  opacity:1;
  transition:0.2s;
}

/* ha nincs kupa */
.cup-badge.inactive{
  opacity:0.25;
  filter: grayscale(1);
}

.gold{ background:linear-gradient(180deg,#ffeb3b,#fbc02d,#f57f17); }
.silver{ background:linear-gradient(180deg,#f5f5f5,#bdbdbd,#757575); }
.bronze{ background:linear-gradient(180deg,#a1887f,#795548,#4e342e); }

.count{
  text-align:center;
  font-weight:800;
  padding:6px 0;
  border-radius:8px;
}

.old{ background:rgba(255,255,255,0.25); }
.total{ background:#4CAF50; }

</style>
</head>

<body>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="score-header">
    <div class="header-item">1. forduló</div>
    <div class="header-item">2. forduló</div>
    <div class="header-item">Összes</div>
  </div>

  <div id="leaderboard-content"></div>
</div>

<script>
const players = [
  { name: "On3door", avatar: "onedoor.png", oldScore: 134, newScore: 0, cups: [{type:"gold",count:1}] },
  { name: "MiszterSusu", avatar: "misztersiba.gif", oldScore: 134, newScore: 52, cups: [{type:"gold",count:1}] },
  { name: "SusuSzaurusz", avatar: "dinoori.gif", oldScore: 84, newScore: 75, cups: [{type:"bronze",count:1}] },
  { name: "Spudbay", avatar: "spudbaymaci.gif", oldScore: 98, newScore: 42, cups: [{type:"silver",count:1}] },
  { name: "MrSusu", avatar: "Mrgrogu.gif", oldScore: 50, newScore: 0, cups: [] }
];

function getCup(p,type){
  const c = p.cups.find(x => x.type === type);
  return c ? c.count : 0;
}

function updateLeaderboard(){
  const container = document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.oldScore + b.newScore) - (a.oldScore + a.newScore)
  );

  container.innerHTML = "";

  players.forEach(p => {

    container.innerHTML += `
      <div class="row">

        <img class="avatar" src="${p.avatar}">

        <div class="name-container">
          <div class="name">${p.name}</div>

          <div class="cup-badge gold ${getCup(p,"gold")?"" : "inactive"}">
            🏆 ${getCup(p,"gold")}
          </div>

          <div class="cup-badge silver ${getCup(p,"silver")?"" : "inactive"}">
            🥈 ${getCup(p,"silver")}
          </div>

          <div class="cup-badge bronze ${getCup(p,"bronze")?"" : "inactive"}">
            🥉 ${getCup(p,"bronze")}
          </div>
        </div>

        <div class="count old">${p.oldScore}</div>
        <div class="count old">${p.newScore}</div>
        <div class="count total">${p.oldScore + p.newScore}</div>

      </div>
    `;
  });
}

updateLeaderboard();
</script>

</body>
</html>
