<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;

  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}

.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

/* LEADERBOARD */
.leaderboard{
  width:900px;
  max-width:95vw;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

h2{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:0 0 15px 0;
}

.grid{
  display:grid;
  grid-template-columns: 70px 1fr 90px 90px 90px 110px 140px;
  gap:10px;
  align-items:center;
}

.score-header{
  margin-bottom:10px;
  font-size:11px;
  font-weight:bold;
  color:rgba(255,255,255,0.7);
  text-align:center;
}

.row{
  background:rgba(0,0,0,.4);
  padding:12px;
  border-radius:18px;
  margin:8px 0;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.name{
  font-size:18px;
  font-weight:900;
}

.count{
  text-align:center;
  font-size:16px;
  font-weight:900;
  padding:6px;
  border-radius:8px;
}

.old{ background:rgba(255,255,255,0.25); }
.total{ background:#4CAF50; }

.cup-column{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

.cup-badge{
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.gold{ background:#fbc02d; }
.silver{ background:#bdbdbd; }
.bronze{ background:#a1887f; }

/* BUTTON */
#dontPressBtn{
  width:260px;
  height:90px;
  background:red;
  color:white;
  font-size:22px;
  font-weight:900;
  border:none;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,0.8);
}

/* VIDEO */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.hidden{
  display:none;
}

.videoBox{
  width:80%;
  max-width:900px;
}

video{
  width:100%;
  border-radius:10px;
}

.closeBtn{
  position:absolute;
  top:20px;
  right:20px;
  background:red;
  color:white;
  border:none;
  padding:8px 12px;
  font-size:18px;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="leaderboard">
    <h2>Flakon Ranglista</h2>

    <div id="leaderboard-content"></div>
  </div>

  <button id="dontPressBtn">NE NYOMD MEG</button>

</div>

<!-- VIDEO OVERLAY -->
<div id="videoOverlay" class="overlay hidden">
  <div class="videoBox">
    <button class="closeBtn" onclick="closeVideo()">X</button>

    <video id="prankVideo" controls autoplay></video>
  </div>
</div>

<script>

/* 🔥 CSAK EZT ÁTÍROD */
const VIDEO_FILE = "video.mp4";

const players = [
  { name:"On3door", avatar:"onedoor.png", round1:134, round2:0, round3:0, cups:[] },
  { name:"MiszterSusu", avatar:"misztersiba.gif", round1:134, round2:52, round3:0, cups:[] },
  { name:"SusuSzaurusz", avatar:"dinoori.gif", round1:84, round2:75, round3:0, cups:[] },
  { name:"Spudbay", avatar:"spudbaymaci.gif", round1:98, round2:42, round3:0, cups:[] },
  { name:"MrSusu", avatar:"Mrgrogu.gif", round1:50, round2:0, round3:0, cups:[] }
];

function assignRound2Cups(){
  const sorted = [...players].sort((a,b)=>b.round2-a.round2);
  players.forEach(p=>p.cups=[]);

  if(sorted[0]) sorted[0].cups.push({type:"gold"});
  if(sorted[1]) sorted[1].cups.push({type:"silver"});
}
assignRound2Cups();

function cupBadge(p,type){
  const has = p.cups.some(c=>c.type===type);
  return `<div class="cup-badge ${type} ${has?"":"inactive"}">${type}</div>`;
}

function updateLeaderboard(){
  const c = document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.round1+b.round2+b.round3)-(a.round1+a.round2+a.round3)
  );

  c.innerHTML="";

  players.forEach(p=>{
    c.innerHTML += `
      <div class="grid row">

        <img class="avatar" src="${p.avatar}">
        <div class="name">${p.name}</div>

        <div class="count old">${p.round1}</div>
        <div class="count old">${p.round2}</div>
        <div class="count old">${p.round3}</div>

        <div class="count total">${p.round1+p.round2+p.round3}</div>

        <div class="cup-column">
          ${cupBadge(p,"gold")}
          ${cupBadge(p,"silver")}
          ${cupBadge(p,"bronze")}
        </div>

      </div>
    `;
  });
}

updateLeaderboard();

/* VIDEO LOGIKA */
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("prankVideo");

document.getElementById("dontPressBtn").onclick = () => {
  overlay.classList.remove("hidden");
  video.src = VIDEO_FILE;   // 🔥 EZ A LÉNYEG
  video.currentTime = 0;
  video.play();
};

function closeVideo(){
  overlay.classList.add("hidden");
  video.pause();
}

video.onended = closeVideo;

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape") closeVideo();
});

</script>

</body>
</html>
