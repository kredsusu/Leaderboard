<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Majom Jump</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("hatter.jpg") center/cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  padding-top: 40px;
}

/* LEADERBOARD */
.leaderboard {
  width: 600px;
  padding: 30px;
  background: url("keret.png") center/cover no-repeat;
  border-radius: 25px;
  color: white;
}

.row {
  display: flex;
  align-items: center;
  gap: 15px;
  background: rgba(0,0,0,.4);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 10px;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

.name {
  font-size: 24px;
  font-weight: bold;
  flex: 1;
}

.count {
  background: white;
  color: black;
  padding: 6px 12px;
  border-radius: 10px;
  font-weight: bold;
}

/* JÁTÉK */
#game {
  width: 500px;
  height: 300px;
  background: url("jatekhatter.jpg") center/cover no-repeat;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
}

#player {
  position: absolute;
  bottom: 30px;
  left: 40px;
  width: 80px;
}

.obstacle {
  position: absolute;
  bottom: 30px;
}
</style>
</head>

<body>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>
  <div class="row"><img class="avatar" src="onedoor.png"><div class="name">On3door</div><div class="count">65</div></div>
  <div class="row"><img class="avatar" src="misztersiba.gif"><div class="name">MiszterSusu</div><div class="count">60</div></div>
  <div class="row"><img class="avatar" src="dinoori.gif"><div class="name">SusuSzaurusz</div><div class="count">58</div></div>
</div>

<div id="game">
  <img id="player" src="majomka.png">
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwx3XvDPbDE6P6x_gXfQlJvL9vAkbbo63wfYSWYOwzYSuH1U4Cz3i7qiCSDcSX8imue/exec";

let score = 0;
let speed = 4;
let obstacle;

function spawnObstacle() {
  obstacle = document.createElement("img");
  obstacle.src = Math.random() < 0.5 ? "banana.png" : "stone.png";
  obstacle.className = "obstacle";
  obstacle.style.width = obstacle.src.includes("banana") ? "52px" : "46px";
  obstacle.style.left = "500px";
  document.getElementById("game").appendChild(obstacle);
}

function gameLoop() {
  score++;

  if (score === 500) speed = 5;
  if (score === 1500) speed = 6;
  if (score === 2000) speed = 7;

  if (!obstacle) spawnObstacle();
  obstacle.style.left = (parseInt(obstacle.style.left) - speed) + "px";

  if (parseInt(obstacle.style.left) < -60) {
    obstacle.remove();
    obstacle = null;
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
