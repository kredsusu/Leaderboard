<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  padding:40px;
  color:#fff;
}

/* LEADERBOARD */
.leaderboard{
  width:850px;
  max-width:95vw;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

h2{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:0 0 15px 0;
}

/* HEADER + ROW UGYANAZ A GRID */
.grid{
  display:grid;
  grid-template-columns: 70px 1.5fr 90px 90px 90px 110px 140px;
  gap:10px;
  align-items:center;
}

/* HEADER */
.score-header{
  margin-bottom:10px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  color:rgba(255,255,255,0.7);
}

/* ROW */
.row{
  background:rgba(0,0,0,.4);
  padding:12px;
  border-radius:18px;
  margin:8px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
}

/* AVATAR */
.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

/* NAME */
.name{
  font-size:18px;
  font-weight:900;
}

/* SCORE */
.count{
  text-align:center;
  font-size:16px;
  font-weight:900;
  padding:6px;
  border-radius:8px;
}

.old{ background:rgba(255,255,255,0.25); }
.total{ background:#4CAF50; }

/* 🏆 KUPA OSZLOP FIX */
.cup-column{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
}

/* KUPA */
.cup-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border-radius:8px;
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
}

.cup-badge.inactive{
  opacity:0.25;
  filter:grayscale(1);
}

.gold{ background:linear-gradient(180deg,#ffeb3b,#fbc02d,#f57f17); }
.silver{ background:linear-gradient(180deg,#f5f5f5,#bdbdbd,#757575); }
.bronze{ background:linear-gradient(180deg,#a1887f,#795548,#4e342e); }

/* GOMB */
#dontPressBtn{
  margin-top:20px;
  width:240px;
  height:85px;
  background:red;
  color:white;
  font-size:22px;
  font-weight:900;
  border:none;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,0.8);
}
</style>
</head>

<body>

<div>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="grid score-header">
    <div></div>
    <div>Név</div>
    <div>1. forduló</div>
    <div>2. forduló</div>
    <div>3. forduló</div>
    <div>Összes</div>
    <div>Kupák</div>
  </div>

  <div id="leaderboard-content"></div>
</div>

<button id="dontPressBtn">NE NYOMD MEG</button>

</div>

<script>
const players = [
  { name:"On3door", avatar:"onedoor.png", round1:134, round2:0, round3:0, cups:[] },
  { name:"MiszterSusu", avatar:"misztersiba.gif", round1:134, round2:52, round3:0, cups:[] },
  { name:"SusuSzaurusz", avatar:"dinoori.gif", round1:84, round2:75, round3:0, cups:[] },
  { name:"Spudbay", avatar:"spudbaymaci.gif", round1:98, round2:42, round3:0, cups:[] },
  { name:"MrSusu", avatar:"Mrgrogu.gif", round1:50, round2:0, round3:0, cups:[] }
];

function assignRound2Cups(){
  const sorted = [...players].sort((a,b)=>b.round2-a.round2);
  players.forEach(p=>p.cups=[]);

  if(sorted[0]) sorted[0].cups.push({type:"gold",count:1});
  if(sorted[1]) sorted[1].cups.push({type:"silver",count:1});
}
assignRound2Cups();

function getCupCount(player,type){
  const c = player.cups.find(x=>x.type===type);
  return c ? c.count : 0;
}

function cupBadge(p,type,icon){
  const count = getCupCount(p,type);
  return `
    <div class="cup-badge ${type} ${count ? "" : "inactive"}">
      ${icon} x${count}
    </div>
  `;
}

function updateLeaderboard(){
  const container = document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.round1+b.round2+b.round3)-(a.round1+a.round2+a.round3)
  );

  container.innerHTML="";

  players.forEach(p=>{
    container.innerHTML += `
      <div class="grid row">

        <img class="avatar" src="${p.avatar}">

        <div class="name">${p.name}</div>

        <div class="count old">${p.round1}</div>
        <div class="count old">${p.round2}</div>
        <div class="count old">${p.round3}</div>

        <div class="count total">${p.round1+p.round2+p.round3}</div>

        <div class="cup-column">
          ${cupBadge(p,"gold","🏆")}
          ${cupBadge(p,"silver","🥈")}
          ${cupBadge(p,"bronze","🥉")}
        </div>

      </div>
    `;
  });
}

updateLeaderboard();

document.getElementById("dontPressBtn").onclick = () => {
  alert("Mondtam hogy NE NYOMD MEG 😄💥");
};
</script>

</body>
</html>
