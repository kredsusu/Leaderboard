<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:40px;
  padding:40px;
  color:#fff;
}

/* LEADERBOARD (EREDETI) */
.leaderboard{
  width:700px;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

h2{
  text-align:center;
  font-size:32px;
  font-weight:800;
  text-shadow:2px 2px 6px #000;
  margin:0 0 15px 0;
}

/* HEADER */
.score-header{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px 90px;
  gap:10px;
  padding:0 14px;
  margin-bottom:10px;
}

.header-item{
  text-align:center;
  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
  color:rgba(255,255,255,0.7);
}

/* ROW */
.row{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px 90px;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,.4);
  padding:10px 14px;
  border-radius:18px;
  margin:6px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.name{
  font-size:18px;
  font-weight:800;
  text-shadow:2px 2px 3px #000;
}

.count{
  font-size:16px;
  font-weight:800;
  text-align:center;
  padding:6px 0;
  border-radius:8px;
}

.old{ background:rgba(255,255,255,0.25); }
.total{ background:#4CAF50; }

/* RIGHT BUTTON */
.rightCol{
  display:flex;
  flex-direction:column;
  gap:20px;
}

#dontPressBtn{
  width:300px;
  height:120px;
  background:red;
  color:white;
  font-size:28px;
  font-weight:900;
  border:none;
  border-radius:20px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,0.8);
  transition:0.2s;
}

#dontPressBtn:hover{
  transform:scale(1.05);
}

#dontPressBtn:active{
  transform:scale(0.98);
}

/* VIDEO OVERLAY */
#videoOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.videoBox{
  width:80%;
  max-width:900px;
  position:relative;
}

video{
  width:100%;
  border-radius:10px;
}

.closeBtn{
  position:absolute;
  top:-40px;
  right:0;
  background:red;
  color:white;
  border:none;
  padding:8px 12px;
  font-size:18px;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LEADERBOARD -->
<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="score-header">
    <div>1. forduló</div>
    <div>2. forduló</div>
    <div>3. forduló</div>
    <div>Összes</div>
  </div>

  <div id="leaderboard-content"></div>
</div>

<!-- GOMB -->
<div class="rightCol">
  <button id="dontPressBtn">NE NYOMD MEG</button>
</div>

<!-- VIDEO -->
<div id="videoOverlay">
  <div class="videoBox">
    <button class="closeBtn" onclick="closeVideo()">X</button>

    <video id="prankVideo" controls autoplay>
      <!-- 🔥 IDE JÖN A VIDEÓ -->
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>
</div>

<script>

/* 🔥 CSAK EZT ÍRD ÁT */
const VIDEO_FILE = "video.mp4";

const players = [
  { name:"On3door", avatar:"onedoor.png", round1:134, round2:0, round3:0 },
  { name:"MiszterSusu", avatar:"misztersiba.gif", round1:134, round2:52, round3:0 },
  { name:"SusuSzaurusz", avatar:"dinoori.gif", round1:84, round2:75, round3:0 },
  { name:"Spudbay", avatar:"spudbaymaci.gif", round1:98, round2:42, round3:0 },
  { name:"MrSusu", avatar:"Mrgrogu.gif", round1:50, round2:0, round3:0 }
];

function updateLeaderboard(){
  const c = document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.round1+b.round2+b.round3)-(a.round1+a.round2+a.round3)
  );

  c.innerHTML="";

  players.forEach(p=>{
    c.innerHTML += `
      <div class="row">

        <img class="avatar" src="${p.avatar}">
        <div class="name">${p.name}</div>

        <div class="count old">${p.round1}</div>
        <div class="count old">${p.round2}</div>
        <div class="count old">${p.round3}</div>

        <div class="count total">${p.round1+p.round2+p.round3}</div>

      </div>
    `;
  });
}

updateLeaderboard();

/* VIDEO LOGIKA */
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("prankVideo");
const source = document.getElementById("videoSource");

document.getElementById("dontPressBtn").onclick = () => {
  overlay.style.display = "flex";
  source.src = VIDEO_FILE;
  video.load();
  video.play();
};

function closeVideo(){
  overlay.style.display = "none";
  video.pause();
  video.currentTime = 0;
}

video.onended = closeVideo;

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeVideo();
});

</script>

</body>
</html>
