<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  display:flex;
  justify-content:center;
  gap:40px;
  padding:40px;
  color:#fff;
}

/* LEADERBOARD */
.leaderboard{
  width:700px;
  padding:25px;
  background:#222;
  border-radius:20px;
}

h2{text-align:center}

/* ROW */
.row{
  display:grid;
  grid-template-columns:60px 1fr 80px 80px 80px 90px;
  gap:10px;
  align-items:center;
  padding:10px;
  margin:6px 0;
  background:#333;
  border-radius:12px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
}

/* KUPA */
.cup-badge{
  padding:3px 6px;
  font-size:12px;
  border-radius:6px;
  margin-right:4px;
  opacity:1;
}

.inactive{
  opacity:0.25;
  filter:grayscale(1);
}

.gold{background:gold;color:#000}
.silver{background:silver;color:#000}
.bronze{background:#cd7f32;color:#000}

/* ADMIN BUTTON */
#adminBtn{
  position:fixed;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff0000;
  color:#fff;
  font-size:22px;
  border:none;
  cursor:pointer;
}

/* MODAL */
#adminPanel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.panel{
  background:#222;
  padding:20px;
  border-radius:12px;
  width:300px;
  text-align:center;
}

.panel button{
  width:100%;
  margin:5px 0;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}

/* VIDEO */
#videoBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<button id="adminBtn">⚙️</button>

<div class="leaderboard">
  <h2>Leaderboard</h2>
  <div id="board"></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="panel">
    <h3>ADMIN</h3>
    <button onclick="playSound()">🔊 Hang</button>
    <button onclick="openVideo()">🎬 Videó</button>
    <button onclick="endRound()">🏁 2. forduló lezárás</button>
    <button onclick="recalcCups()">🏆 Kupák újraszámolása</button>
    <button onclick="closeAdmin()">Bezár</button>
  </div>
</div>

<!-- VIDEO -->
<div id="videoBox" onclick="closeVideo()">
  <video width="600" controls autoplay>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<script>
/* PLAYERS */
const players = [
  {name:"Spudbay", avatar:"a.png", r1:10, r2:50, r3:0, cups:[]},
  {name:"SusuSzaurusz", avatar:"b.png", r1:20, r2:30, r3:0, cups:[]},
  {name:"Kata", avatar:"c.png", r1:40, r2:10, r3:0, cups:[]}
];

/* CUP LOGIC */
function recalcCups(){
  const sorted=[...players].sort((a,b)=>b.r2-a.r2);
  players.forEach(p=>p.cups=[]);

  if(sorted[0]) sorted[0].cups.push({type:"gold"});
  if(sorted[1]) sorted[1].cups.push({type:"silver"});

  render();
}

/* END ROUND */
function endRound(){
  alert("2. forduló lezárva!");
}

/* SOUND */
function playSound(){
  const audio = new Audio("sound.mp3");
  audio.play();
}

/* VIDEO */
function openVideo(){
  document.getElementById("videoBox").style.display="flex";
}
function closeVideo(){
  document.getElementById("videoBox").style.display="none";
}

/* ADMIN */
const panel=document.getElementById("adminPanel");

document.getElementById("adminBtn").onclick=()=>{
  const pass=prompt("Admin jelszó:");
  if(pass==="1234"){
    panel.style.display="flex";
  }else{
    alert("Hibás jelszó!");
  }
};

function closeAdmin(){
  panel.style.display="none";
}

/* RENDER */
function getCup(p,type){
  return p.cups.find(c=>c.type===type);
}

function render(){
  const board=document.getElementById("board");
  board.innerHTML="";

  players.forEach(p=>{
    board.innerHTML+=`
      <div class="row">
        <img class="avatar" src="${p.avatar}">
        <div>${p.name}</div>

        <div>${p.r1}</div>
        <div>${p.r2}</div>
        <div>${p.r3}</div>

        <div>
          <span class="cup-badge gold ${getCup(p,'gold')?'':'inactive'}">🥇</span>
          <span class="cup-badge silver ${getCup(p,'silver')?'':'inactive'}">🥈</span>
          <span class="cup-badge bronze inactive">🥉</span>
        </div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
