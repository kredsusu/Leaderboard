<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majom Jump</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("hatter.jpg") center/cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 60px;
  padding-top: 40px;
}

/* LEADERBOARD (5 SOR, AHOGY KÉRTED) */
.leaderboard {
  width: 600px;
  padding: 30px;
  background: url("keret.png") center/cover no-repeat;
  border-radius: 25px;
  color: white;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
}
.leaderboard h2 {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 2px 2px 6px #000;
  margin-bottom: 30px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: rgba(0,0,0,.4);
  padding: 14px 16px;
  border-radius: 20px;
  margin: 12px 0;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  border: 4px solid transparent;
}
.row:nth-child(2) { border-color: gold; }
.row:nth-child(3) { border-color: silver; }
.row:nth-child(4) { border-color: #cd7f32; }

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 16px;
  border: 3px solid #fff;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.name {
  font-size: 24px;
  font-weight: bold;
  flex: 1;
  text-shadow: 2px 2px 3px #000;
}
.count {
  font-size: 22px;
  font-weight: bold;
  background: #f5f5f5;
  color: #000;
  padding: 8px 12px;
  border-radius: 12px;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  min-width: 60px;
  text-align: center;
}

/* JOBB OLDAL (JÁTÉK) */
.rightCol {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

.hud {
  width: 680px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-weight: bold;
  color: #fff;
  text-shadow: 2px 2px 6px #000;
}
.hud .pill {
  background: rgba(0,0,0,.35);
  padding: 8px 12px;
  border-radius: 999px;
}

#game {
  width: 680px;
  height: 380px;
  background: url("jatekhatter.jpg") center/cover no-repeat;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,.6);
}

#player {
  position: absolute;
  left: 60px;
  width: 90px;
  user-select: none;
  -webkit-user-drag: none;
}

.obstacle {
  position: absolute;
  bottom: 30px;
  user-select: none;
  -webkit-user-drag: none;
}

/* START / GAME OVER overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: grid;
  place-items: center;
  padding: 14px;
}
.modal {
  background: rgba(0,0,0,0.80);
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  color: white;
  width: min(420px, 92%);
}
.modal h3 {
  margin: 0 0 10px 0;
  font-size: 22px;
}
.modal input {
  width: 90%;
  max-width: 280px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
}
.modal button {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
.hint {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.9;
}
</style>
</head>

<body>

<!-- LEADERBOARD (NEM VÁLTOZTATVA) -->
<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="row">
    <img class="avatar" src="onedoor.png" alt="Avatar">
    <div class="name">On3door</div>
    <div class="count">65</div>
  </div>

  <div class="row">
    <img class="avatar" src="misztersiba.gif" alt="Avatar">
    <div class="name">MiszterSusu</div>
    <div class="count">60</div>
  </div>

  <div class="row">
    <img class="avatar" src="dinoori.gif" alt="Avatar">
    <div class="name">SusuSzaurusz</div>
    <div class="count">58</div>
  </div>

  <div class="row">
    <img class="avatar" src="spudbaymaci.gif" alt="Avatar">
    <div class="name">Spudbay</div>
    <div class="count">55</div>
  </div>

  <div class="row">
    <img class="avatar" src="Mrgrogu.gif" alt="Avatar">
    <div class="name">MrSusu</div>
    <div class="count">50</div>
  </div>
</div>

<!-- JÁTÉK JOBB OLDALT -->
<div class="rightCol">
  <div class="hud">
    <div class="pill" id="hudPlayer">Játékos: -</div>
    <div class="pill" id="hudScore">Pont: 0</div>
    <div class="pill" id="hudBest">Rekord: - - 0</div>
  </div>

  <div id="game">
    <img id="player" src="majomka.png" alt="player">

    <!-- START OVERLAY -->
    <div id="startOverlay" class="overlay">
      <div class="modal">
        <h3>Majom Jump</h3>
        <div>Írd be a neved:</div>
        <input id="nameInput" maxlength="18" placeholder="Pl. On3door">
        <br>
        <button id="startBtn">START</button>
        <div class="hint">Ugrás: Space / ▲ / kattintás</div>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="overOverlay" class="overlay" style="display:none;">
      <div class="modal">
        <h3>Game Over</h3>
        <div id="overText">Pont: 0</div>
        <button id="restartBtn">Újra</button>
        <div class="hint">Ugrás: Space / ▲ / kattintás</div>
      </div>
    </div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwx3XvDPbDE6P6x_gXfQlJvL9vAkbbo63wfYSWYOwzYSuH1U4Cz3i7qiCSDcSX8imue/exec";

const game = document.getElementById("game");
const playerEl = document.getElementById("player");

const hudPlayer = document.getElementById("hudPlayer");
const hudScore  = document.getElementById("hudScore");
const hudBest   = document.getElementById("hudBest");

const startOverlay = document.getElementById("startOverlay");
const overOverlay  = document.getElementById("overOverlay");
const overText     = document.getElementById("overText");
const nameInput    = document.getElementById("nameInput");
const startBtn     = document.getElementById("startBtn");
const restartBtn   = document.getElementById("restartBtn");

let playerName = "";
let bestName = "-";
let bestScore = 0;

/* ====== globális rekord betöltés/mentés ====== */
async function loadBest() {
  try {
    const r = await fetch(API_URL, { method: "GET" });
    const j = await r.json();
    bestName = (j && j.name) ? String(j.name) : "-";
    bestScore = Number(j && j.score ? j.score : 0);
    if (isNaN(bestScore)) bestScore = 0;
    hudBest.textContent = `Rekord: ${bestName} - ${bestScore}`;
  } catch (e) {
    hudBest.textContent = `Rekord: ${bestName} - ${bestScore}`;
  }
}

async function trySaveBest(score) {
  try {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: playerName, score })
    });
    await loadBest();
  } catch (e) {}
}

loadBest();

/* ====== JÁTÉK ====== */
let running = false;
let alive = true;

let score = 0;
let speed = 4;

let y = 0;
let vy = 0;
const GRAVITY = 0.9;
const JUMP_V = 19;                 // ✅ nagyobb ugrás

let obstacles = [];
let nextSpawnAt = 0;

function showStart() {
  running = false;
  startOverlay.style.display = "grid";
  overOverlay.style.display = "none";
  hudPlayer.textContent = "Játékos: -";
  hudScore.textContent = "Pont: 0";
}

function resetGame() {
  score = 0;
  speed = 4;
  y = 0;
  vy = 0;
  alive = true;

  obstacles.forEach(o => o.el.remove());
  obstacles = [];

  nextSpawnAt = 60 + Math.floor(Math.random() * 80);

  hudScore.textContent = "Pont: 0";
  playerEl.style.bottom = (30 + y) + "px";
}

function startGame() {
  playerName = (nameInput.value || "").trim() || "Névtelen";
  hudPlayer.textContent = "Játékos: " + playerName;

  startOverlay.style.display = "none";
  overOverlay.style.display = "none";

  resetGame();
  running = true;
  requestAnimationFrame(loop);
}

function jump() {
  if (!running || !alive) return;
  if (y <= 0) vy = JUMP_V;
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    if (startOverlay.style.display !== "none") return;
    jump();
  }
});
game.addEventListener("pointerdown", () => {
  if (startOverlay.style.display !== "none") return;
  jump();
});

startBtn.addEventListener("click", startGame);
nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") startGame();
});
restartBtn.addEventListener("click", startGame);

function spawnObstacle() {
  const isBanana = Math.random() < 0.5;
  const el = document.createElement("img");
  el.src = isBanana ? "banana.png" : "stone.png";
  el.className = "obstacle";

  const size = isBanana ? 52 : 46;
  el.style.width = size + "px";
  el.style.left = game.clientWidth + "px";
  game.appendChild(el);

  obstacles.push({
    el,
    x: game.clientWidth,
    w: size,
    h: size,
    type: isBanana ? "banana" : "stone"
  });

  nextSpawnAt = score + 80 + Math.floor(Math.random() * 140);
}

function rectsOverlap(a, b) {
  return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
}

function gameOver() {
  alive = false;
  running = false;

  overText.innerHTML = `Pont: <b>${score}</b>`;

  // ha jobb a globális rekordnál, akkor feltoljuk
  if (score > bestScore) {
    trySaveBest(score);
  } else {
    // csak frissítjük, hogy mindig ugyanazt lássa mindenki
    loadBest();
  }

  overOverlay.style.display = "grid";
}

function loop() {
  if (!running || !alive) return;

  score++;
  hudScore.textContent = "Pont: " + score;

  // ✅ Chrome dino jellegű folyamatos gyorsulás (plafonnal)
  speed = Math.min(11, 4 + score / 500);

  // ugrás fizika
  vy -= GRAVITY;
  y += vy;
  if (y < 0) { y = 0; vy = 0; }
  playerEl.style.bottom = (30 + y) + "px";

  // spawn random
  if (score >= nextSpawnAt) spawnObstacle();

  // ✅ hitbox javítás: kisebb játékos hitbox (fair)
  const playerBox = {
    x: 60 + 18,
    y: (30 + y) + 18,
    w: 90 - 36,
    h: 90 - 36
  };

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    o.el.style.left = o.x + "px";

    if (o.x < -80) {
      o.el.remove();
      obstacles.splice(i, 1);
      continue;
    }

    // ✅ akadály hitbox shrink (kő nagyobb shrink -> fair)
    const shrink = o.type === "stone" ? 22 : 14;
    const obsBox = {
      x: o.x + shrink,
      y: 30 + shrink,
      w: o.w - shrink * 2,
      h: o.h - shrink * 2
    };

    if (rectsOverlap(playerBox, obsBox)) {
      gameOver();
      return;
    }
  }

  requestAnimationFrame(loop);
}

// induláskor csak a start overlay látszik
showStart();
</script>

</body>
</html>
