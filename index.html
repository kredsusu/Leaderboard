<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Flakon leaderboard </title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:60px;
  padding-top:40px;
  color:#fff;
}

/* ===== Leaderboard (5 sor, eredeti) ===== */
.leaderboard{
  width:600px;
  padding:30px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}
.leaderboard h2{
  text-align:center;
  font-size:36px;
  font-weight:800;
  text-shadow:2px 2px 6px #000;
  margin:0 0 30px 0;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:rgba(0,0,0,.4);
  padding:14px 16px;
  border-radius:20px;
  margin:12px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
  border:4px solid transparent;
}
.row:nth-child(2){border-color:gold;}
.row:nth-child(3){border-color:silver;}
.row:nth-child(4){border-color:#cd7f32;}

.avatar{
  width:70px;height:70px;border-radius:50%;
  object-fit:cover;border:3px solid #fff;
  box-shadow:2px 2px 4px rgba(0,0,0,.5);
}
.name{font-size:24px;font-weight:800;flex:1;text-shadow:2px 2px 3px #000;}
.count{
  font-size:22px;font-weight:800;
  background:#f5f5f5;color:#000;
  padding:8px 12px;border-radius:12px;
  min-width:60px;text-align:center;
  box-shadow:2px 2px 4px rgba(0,0,0,.4);
}

/* ===== Jobb oldal: HUD + Game ===== */
.rightCol{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.hud{width:680px;display:flex;justify-content:space-between;gap:10px;font-weight:800;text-shadow:2px 2px 6px #000;}
.pill{background:rgba(0,0,0,.35);padding:8px 12px;border-radius:999px;white-space:nowrap;}
.pill strong{font-weight:900}

#game{
  width:680px;height:380px;

  background-image: url("jatekhatter.jpg");
  background-size: cover;
  background-repeat: repeat-x;
  background-position: 0px 0px;

  border-radius:20px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,.6);
  touch-action: manipulation;
}

#player{
  position:absolute;
  left:60px;
  width:90px;
  user-select:none;
  -webkit-user-drag:none;
  transform-origin:bottom;
}

.obstacle{
  position:absolute;
  user-select:none;
  -webkit-user-drag:none;
}

/* ===== Overlay (Start/GameOver) ===== */
.overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.55);
  display:grid;place-items:center;
  padding:14px;
}
.modal{
  background:rgba(0,0,0,.82);
  padding:16px 18px;
  border-radius:14px;
  width:min(440px,92%);
  box-shadow:0 12px 40px rgba(0,0,0,.55);
  text-align:center;
}
.modal h3{margin:0 0 10px 0;font-size:22px;}
.modal input{
  width:90%;max-width:280px;
  padding:10px;border-radius:10px;border:none;
  outline:none;font-size:16px;
}
.modal button{
  margin-top:10px;
  padding:10px 14px;
  border-radius:10px;border:none;
  cursor:pointer;font-weight:900;
}
.hint{margin-top:10px;font-size:12px;opacity:.9;}
.small{font-size:12px;opacity:.85;margin-top:6px;}

/* ===== MOBILE (telefon) ===== */
@media (max-width: 1100px) {
  body{
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 20px 12px;
  }
  .leaderboard{
    width: min(600px, 92vw);
    padding: 22px;
  }
  .rightCol{
    width: min(680px, 92vw);
    align-items: center;
  }
  .hud{
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
  }
  #game{
    width: 100%;
    height: 52vw;
    max-height: 420px;
    min-height: 300px;
  }
}
</style>
</head>

<body>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="row">
    <img class="avatar" src="onedoor.png" alt="Avatar">
    <div class="name">On3door</div>
    <div class="count">65</div>
  </div>

  <div class="row">
    <img class="avatar" src="misztersiba.gif" alt="Avatar">
    <div class="name">MiszterSusu</div>
    <div class="count">60</div>
  </div>

  <div class="row">
    <img class="avatar" src="dinoori.gif" alt="Avatar">
    <div class="name">SusuSzaurusz</div>
    <div class="count">58</div>
  </div>

  <div class="row">
    <img class="avatar" src="spudbaymaci.gif" alt="Avatar">
    <div class="name">Spudbay</div>
    <div class="count">55</div>
  </div>

  <div class="row">
    <img class="avatar" src="Mrgrogu.gif" alt="Avatar">
    <div class="name">MrSusu</div>
    <div class="count">50</div>
  </div>
</div>

<div class="rightCol">
  <div class="hud">
    <div class="pill" id="hudPlayer">Játékos: -</div>
    <div class="pill" id="hudScore">Pont: 0</div>
    <div class="pill" id="hudBest">Rekord: - - 0</div>
  </div>

  <div id="game">
    <img id="player" src="majomka.png" alt="player">

    <!-- START -->
    <div id="startOverlay" class="overlay">
      <div class="modal">
        <h3>Majom Jump</h3>
        <div>Írd be a neved:</div>
        <input id="nameInput" maxlength="18" placeholder="Pl. On3door">
        <br>
        <button id="startBtn">START</button>
        <div class="hint">Ugrás: Space / ▲ / tap</div>
        <div class="hint">Gugolás: S</div>
        <div class="small">Tipp: a lelógó INDA alá gugolni kell 😉</div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="overOverlay" class="overlay" style="display:none;">
      <div class="modal">
        <h3>Game Over</h3>
        <div id="overText">Pont: 0</div>
        <button id="restartBtn">Újra</button>
      </div>
    </div>

    <!-- MOBIL VEZÉRLÉS -->
    <div id="mobileControls" style="
      position:absolute; left:0; right:0; bottom:12px;
      display:none; justify-content:space-between;
      padding:0 12px; gap:12px; pointer-events:none;">
      <button id="btnJump" style="
        pointer-events:auto; flex:1;
        padding:14px 0; border-radius:16px;
        border:none; font-weight:900; font-size:16px;
        background:rgba(0,0,0,0.45); color:#fff;">
        UGRÁS
      </button>
      <button id="btnCrouch" style="
        pointer-events:auto; width:38%;
        padding:14px 0; border-radius:16px;
        border:none; font-weight:900; font-size:16px;
        background:rgba(0,0,0,0.45); color:#fff;">
        GUGOL
      </button>
    </div>

  </div>
</div>

<script>
/* ====== Sebesség (játszhatóbb) ====== */
const BASE_SPEED = 3.2;
const SPEED_DIV  = 1100;
const MAX_SPEED  = 7.2;

/* ====== Fizika ====== */
const GRAVITY = 0.9;
const JUMP_V  = 19;

/* ====== API ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbwx3XvDPbDE6P6x_gXfQlJvL9vAkbbo63wfYSWYOwzYSuH1U4Cz3i7qiCSDcSX8imue/exec";

/* ====== INDA (beépített SVG, nincs külön fájl) ====== */
const VINES_SVG = encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="140" viewBox="0 0 80 140">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36a84a"/>
      <stop offset="1" stop-color="#0f5a24"/>
    </linearGradient>
  </defs>
  <path d="M40 0 C33 25, 54 40, 40 62 C26 84, 54 102, 40 140" stroke="url(#g)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M22 0 C18 22, 32 34, 22 52 C12 72, 30 94, 22 138" stroke="url(#g)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M58 0 C62 20, 50 38, 58 58 C66 78, 50 100, 58 138" stroke="url(#g)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M28 28 C18 22,14 34,24 40 C34 46,40 32,28 28Z" fill="#2ed063" opacity="0.95"/>
  <path d="M52 44 C62 38,66 50,56 56 C46 62,42 48,52 44Z" fill="#2ed063" opacity="0.95"/>
  <path d="M26 78 C16 72,12 84,22 90 C32 96,38 82,26 78Z" fill="#1fb454" opacity="0.95"/>
  <path d="M54 96 C64 90,68 102,58 108 C48 114,44 100,54 96Z" fill="#1fb454" opacity="0.95"/>
</svg>
`);
const VINES_SRC = "data:image/svg+xml;charset=UTF-8," + VINES_SVG;

/* ====== DOM ====== */
const game = document.getElementById("game");
const playerEl = document.getElementById("player");

const hudPlayer = document.getElementById("hudPlayer");
const hudScore  = document.getElementById("hudScore");
const hudBest   = document.getElementById("hudBest");

const startOverlay = document.getElementById("startOverlay");
const overOverlay  = document.getElementById("overOverlay");
const overText     = document.getElementById("overText");
const nameInput    = document.getElementById("nameInput");
const startBtn     = document.getElementById("startBtn");
const restartBtn   = document.getElementById("restartBtn");

const mobileControls = document.getElementById("mobileControls");
const btnJump = document.getElementById("btnJump");
const btnCrouch = document.getElementById("btnCrouch");

/* ====== rekord ====== */
let bestName = "-";
let bestScore = 0;

async function loadBest(){
  try{
    const r = await fetch(API_URL, { method:"GET" });
    const j = await r.json();
    bestName = (j && j.name) ? String(j.name) : "-";
    bestScore = Number(j && j.score ? j.score : 0);
    if (isNaN(bestScore)) bestScore = 0;
  } catch {}
  hudBest.textContent = `Rekord: ${bestName} - ${bestScore}`;
}
async function trySaveBest(playerName, score){
  try{
    await fetch(API_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ name: playerName, score })
    });
  } catch {}
  await loadBest();
}
loadBest();

/* ====== JÁTÉK ====== */
let running=false, alive=false;
let playerName="-";
let score=0, speed=4;
let y=0, vy=0;
let crouch=false;

let obstacles=[];
let dist=0, nextSpawnDist=0;
let bgX=0;

let lastType="banana";

function setPlayerBottom(){ playerEl.style.bottom = (30 + y) + "px"; }
function setCrouch(v){
  crouch = v;
  playerEl.style.transform = crouch ? "scaleY(0.75)" : "scaleY(1)";
}

function updateMobileUI(){
  const isMobile = window.matchMedia("(max-width: 1100px)").matches;
  mobileControls.style.display = isMobile ? "flex" : "none";
}
window.addEventListener("resize", updateMobileUI);
updateMobileUI();

btnJump.addEventListener("pointerdown", (e)=>{ e.preventDefault(); jump(); });
btnCrouch.addEventListener("pointerdown", (e)=>{ e.preventDefault(); setCrouch(true); });
btnCrouch.addEventListener("pointerup", (e)=>{ e.preventDefault(); setCrouch(false); });
btnCrouch.addEventListener("pointercancel", ()=> setCrouch(false));
btnCrouch.addEventListener("pointerleave", ()=> setCrouch(false));

function resetGame(){
  score=0; speed=4; y=0; vy=0; dist=0; bgX=0;
  game.style.backgroundPosition = "0px 0px";
  obstacles.forEach(o=>o.el.remove());
  obstacles=[];
  nextSpawnDist = 380 + Math.random()*260;
  hudScore.textContent = "Pont: 0";
  setCrouch(false);
  setPlayerBottom();
}

function startGame(){
  playerName = (nameInput.value || "").trim() || "Névtelen";
  hudPlayer.textContent = "Játékos: " + playerName;
  resetGame();
  alive=true; running=true;
  startOverlay.style.display="none";
  overOverlay.style.display="none";
  requestAnimationFrame(loop);
}

function jump(){
  if (!running || !alive) return;
  if (y <= 0) vy = JUMP_V;
}

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);
nameInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") startGame(); });

/* ===== Billentyűk =====
   Ugrás: Space / ArrowUp
   Gugolás: S (KeyS)  ✅
*/
document.addEventListener("keydown",(e)=>{
  if (e.code === "KeyS") setCrouch(true);      // ✅ S = gugolás
  if (e.code === "Space" || e.code === "ArrowUp"){
    e.preventDefault();
    jump();
  }
});
document.addEventListener("keyup",(e)=>{
  if (e.code === "KeyS") setCrouch(false);
});

game.addEventListener("pointerdown", ()=> {
  if (startOverlay.style.display !== "none") return;
  if (overOverlay.style.display !== "none") return;
  jump();
});

/* ===== Akadályok ===== */
function spawnObstacle(){
  const r = Math.random();
  let type;
  if (r < 0.55) type = "banana";
  else if (r < 0.82) type = "stone";
  else type = "vines";          // ✅ felső akadály: inda

  // ne legyen nehéz-nehez egymás után
  if ((type === "stone" || type === "vines") && (lastType === "stone" || lastType === "vines")) {
    type = "banana";
  }
  lastType = type;

  const el = document.createElement("img");
  el.className = "obstacle";

  let w, h, bottomPx;

  if (type === "banana"){
    el.src="banana.png"; w=52; h=52; bottomPx=30;
  } else if (type === "stone"){
    el.src="stone.png"; w=46; h=46; bottomPx=30;
  } else {
    // ✅ INDA: úgy lóg le, hogy állva beleérsz, S-sel gugolva nem
    el.src = VINES_SRC;
    w = 72;
    h = 140;
    bottomPx = 70;  // <<< EZ A KULCS: lejjebb van, ezért KELL gugolni
  }

  el.style.width = w+"px";
  el.style.height = h+"px";
  el.style.bottom = bottomPx+"px";
  el.style.left = game.clientWidth+"px";
  game.appendChild(el);

  const mult = 0.95 + Math.random()*0.16; // játszható szórás

  obstacles.push({ el, x: game.clientWidth, w, h, type, bottom: bottomPx, mult });

  const gapMin = 420, gapMax = 700;
  nextSpawnDist = dist + (gapMin + Math.random()*(gapMax-gapMin));
}

function rectsOverlap(a,b){
  return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
}

function gameOver(){
  alive=false; running=false;
  overText.innerHTML = `Pont: <b>${score}</b>`;
  overOverlay.style.display="grid";
  if (score > bestScore) trySaveBest(playerName, score);
  else loadBest();
}

function loop(){
  if (!running || !alive) return;

  score++;
  hudScore.textContent = "Pont: " + score;

  speed = Math.min(MAX_SPEED, BASE_SPEED + score / SPEED_DIV);

  dist += speed;
  bgX -= speed;
  game.style.backgroundPosition = `${bgX}px 0px`;

  vy -= GRAVITY;
  y += vy;
  if (y < 0){ y=0; vy=0; }
  setPlayerBottom();

  if (dist >= nextSpawnDist) spawnObstacle();

  /* ===== Player hitbox (földtől mért koordinátában) =====
     ÁLLVA: magasabb (fej is)
     GUGOLVA: alacsony, ezért fér el az inda alatt
  */
  const baseY = (30 + y);
  const playerBox = crouch
    ? { x: 60 + 16, y: baseY + 8,  w: 90 - 32, h: 34 }  // gugolva kicsi
    : { x: 60 + 16, y: baseY + 14, w: 90 - 32, h: 66 }; // állva magas (ütközik indába)

  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];

    o.x -= speed * o.mult;
    o.el.style.left = o.x + "px";

    if (o.x < -160){
      o.el.remove();
      obstacles.splice(i,1);
      continue;
    }

    // ✅ INDA hitbox legyen szigorúbb (kelljen gugolni)
    let shrink;
    if (o.type === "vines") shrink = 10;
    else if (o.type === "stone") shrink = 22;
    else shrink = 14;

    const obsBox = {
      x: o.x + shrink,
      y: o.bottom + shrink,
      w: o.w - shrink*2,
      h: o.h - shrink*2
    };

    if (rectsOverlap(playerBox, obsBox)){
      gameOver();
      return;
    }
  }

  requestAnimationFrame(loop);
}

/* nincs auto-start */
startOverlay.style.display="grid";
overOverlay.style.display="none";
</script>

</body>
</html>
