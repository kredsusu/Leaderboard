<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majom Jump</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("hatter.jpg") center/cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 60px;
  padding-top: 40px;
}

/* LEADERBOARD (AZ EREDETI DIZÁJNOD) */
.leaderboard {
  width: 600px;
  padding: 30px;
  background: url("keret.png") center/cover no-repeat;
  border-radius: 25px;
  color: white;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
}

.leaderboard h2 {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 2px 2px 6px #000;
  margin-bottom: 30px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: rgba(0,0,0,.4);
  padding: 14px 16px;
  border-radius: 20px;
  margin: 12px 0;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  border: 4px solid transparent;
}

/* 1-2-3 keret színek (fejléc az 1. child, ezért 2/3/4) */
.row:nth-child(2) { border-color: gold; }
.row:nth-child(3) { border-color: silver; }
.row:nth-child(4) { border-color: #cd7f32; }

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 16px;
  border: 3px solid #fff;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.name {
  font-size: 24px;
  font-weight: bold;
  flex: 1;
  text-shadow: 2px 2px 3px #000;
}

.count {
  font-size: 22px;
  font-weight: bold;
  background: #f5f5f5;
  color: #000;
  padding: 8px 12px;
  border-radius: 12px;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  min-width: 60px;
  text-align: center;
}

/* JÁTÉK */
.rightCol {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

.hud {
  width: 680px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-weight: bold;
  color: #fff;
  text-shadow: 2px 2px 6px #000;
}

.hud .pill {
  background: rgba(0,0,0,.35);
  padding: 8px 12px;
  border-radius: 999px;
}

#game {
  width: 680px;
  height: 380px;
  background: url("jatekhatter.jpg") center/cover no-repeat;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,.6);
}

#player {
  position: absolute;
  bottom: 30px;
  left: 60px;
  width: 90px;
  user-select: none;
  -webkit-user-drag: none;
}

.obstacle {
  position: absolute;
  bottom: 30px;
  user-select: none;
  -webkit-user-drag: none;
}
</style>
</head>

<body>

<!-- LEADERBOARD: 5 SOR, AHOGY AZ EREDETIBEN -->
<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="row">
    <img class="avatar" src="onedoor.png" alt="Avatar">
    <div class="name">On3door</div>
    <div class="count">65</div>
  </div>

  <div class="row">
    <img class="avatar" src="misztersiba.gif" alt="Avatar">
    <div class="name">MiszterSusu</div>
    <div class="count">60</div>
  </div>

  <div class="row">
    <img class="avatar" src="dinoori.gif" alt="Avatar">
    <div class="name">SusuSzaurusz</div>
    <div class="count">58</div>
  </div>

  <div class="row">
    <img class="avatar" src="spudbaymaci.gif" alt="Avatar">
    <div class="name">Spudbay</div>
    <div class="count">55</div>
  </div>

  <div class="row">
    <img class="avatar" src="Mrgrogu.gif" alt="Avatar">
    <div class="name">MrSusu</div>
    <div class="count">50</div>
  </div>
</div>

<!-- JÁTÉK JOBB OLDALT -->
<div class="rightCol">
  <div class="hud">
    <div class="pill" id="hudPlayer">Játékos: -</div>
    <div class="pill" id="hudScore">Pont: 0</div>
    <div class="pill" id="hudBest">Rekord: - - 0</div>
  </div>

  <div id="game">
    <img id="player" src="majomka.png" alt="player">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwx3XvDPbDE6P6x_gXfQlJvL9vAkbbo63wfYSWYOwzYSuH1U4Cz3i7qiCSDcSX8imue/exec";

const game = document.getElementById("game");
const playerEl = document.getElementById("player");

const hudPlayer = document.getElementById("hudPlayer");
const hudScore  = document.getElementById("hudScore");
const hudBest   = document.getElementById("hudBest");

let playerName = localStorage.getItem("mj_name") || "";
if (!playerName) {
  playerName = prompt("Add meg a neved:") || "Névtelen";
  localStorage.setItem("mj_name", playerName);
}
hudPlayer.textContent = "Játékos: " + playerName;

let bestName = "-";
let bestScore = 0;

async function loadBest() {
  try {
    const r = await fetch(API_URL, { method: "GET" });
    const j = await r.json();
    bestName = (j && j.name) ? String(j.name) : "-";
    bestScore = Number(j && j.score ? j.score : 0);
    if (isNaN(bestScore)) bestScore = 0;
    hudBest.textContent = `Rekord: ${bestName} - ${bestScore}`;
  } catch (e) {
    hudBest.textContent = `Rekord: ${bestName} - ${bestScore}`;
  }
}

async function trySaveBest(score) {
  try {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: playerName, score })
    });
    await loadBest();
  } catch (e) {}
}

loadBest();

/* ====== JÁTÉK LOGIKA (DINO-SZERŰ) ====== */
let score = 0;
let speed = 4;

let y = 0;
let vy = 0;
const GRAVITY = 0.9;
const JUMP_V = 16.5;

let obstacles = [];
let nextSpawnAt = 0;
let alive = true;

function resetGame() {
  score = 0;
  speed = 4;
  y = 0;
  vy = 0;
  alive = true;

  obstacles.forEach(o => o.el.remove());
  obstacles = [];

  nextSpawnAt = 60 + Math.floor(Math.random() * 80);

  hudScore.textContent = "Pont: 0";
  playerEl.style.bottom = (30 + y) + "px";

  requestAnimationFrame(loop);
}

function jump() {
  if (!alive) return;
  if (y <= 0) vy = JUMP_V;
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});
game.addEventListener("pointerdown", jump);

function spawnObstacle() {
  const isBanana = Math.random() < 0.5;
  const el = document.createElement("img");
  el.src = isBanana ? "banana.png" : "stone.png";
  el.className = "obstacle";

  const size = isBanana ? 52 : 46;
  el.style.width = size + "px";

  el.style.left = game.clientWidth + "px";
  game.appendChild(el);

  obstacles.push({ el, x: game.clientWidth, w: size, h: size, type: isBanana ? "banana" : "stone" });

  nextSpawnAt = score + 80 + Math.floor(Math.random() * 140);
}

function rectsOverlap(a, b) {
  return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
}

function loop() {
  if (!alive) return;

  score++;
  hudScore.textContent = "Pont: " + score;

  // DINO-SZERŰ FOKOZATOS GYORSULÁS (plafonnal)
  speed = Math.min(11, 4 + score / 500);

  vy -= GRAVITY;
  y += vy;
  if (y < 0) { y = 0; vy = 0; }
  playerEl.style.bottom = (30 + y) + "px";

  if (score >= nextSpawnAt) spawnObstacle();

  const playerBox = {
    x: 60 + 12,
    y: (30 + y) + 12,
    w: 90 - 24,
    h: 90 - 24
  };

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    o.el.style.left = o.x + "px";

    if (o.x < -80) {
      o.el.remove();
      obstacles.splice(i, 1);
      continue;
    }

    const shrink = o.type === "stone" ? 16 : 10;
    const obsBox = { x: o.x + shrink, y: 30 + shrink, w: o.w - shrink * 2, h: o.h - shrink * 2 };

    if (rectsOverlap(playerBox, obsBox)) {
      alive = false;
      if (score > bestScore) trySaveBest(score);
      setTimeout(() => {
        alert("Game Over! Pont: " + score);
        resetGame();
      }, 10);
      return;
    }
  }

  requestAnimationFrame(loop);
}

resetGame();
</script>

</body>
</html>
