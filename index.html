<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  display:flex;
  justify-content:center;
  padding:40px;
  color:#fff;
}

/* LEADERBOARD */
.leaderboard{
  width:750px;
  background:#222;
  padding:20px;
  border-radius:16px;
}

h2{
  text-align:center;
}

/* HEADER */
.header{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px 120px;
  gap:10px;
  font-size:12px;
  opacity:0.7;
  margin-bottom:10px;
}

/* ROW */
.row{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px 120px;
  gap:10px;
  align-items:center;
  padding:10px;
  margin:6px 0;
  background:#333;
  border-radius:10px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
}

/* NAME */
.name{
  font-weight:bold;
}

/* CUPS */
.cups{
  display:flex;
  gap:6px;
}

.cup{
  padding:3px 6px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  opacity:1;
}

.inactive{
  opacity:0.25;
  filter:grayscale(1);
}

.gold{background:gold;color:#000;}
.silver{background:silver;color:#000;}
.bronze{background:#cd7f32;color:#000;}

/* ADMIN */
#adminBtn{
  position:fixed;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  background:red;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

#panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.box{
  background:#222;
  padding:20px;
  border-radius:10px;
  width:300px;
}

.box button{
  width:100%;
  padding:10px;
  margin:5px 0;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<button id="adminBtn">⚙️</button>

<div class="leaderboard">
  <h2>Leaderboard</h2>

  <div class="header">
    <div></div>
    <div>Név</div>
    <div>R1</div>
    <div>R2</div>
    <div>R3</div>
    <div>Kupák</div>
  </div>

  <div id="board"></div>
</div>

<!-- ADMIN -->
<div id="panel">
  <div class="box">
    <h3>ADMIN PANEL</h3>
    <button onclick="playSound()">🔊 Hang</button>
    <button onclick="playVideo()">🎬 Videó</button>
    <button onclick="recalc()">🏆 Kupák újraszámolása</button>
    <button onclick="closePanel()">Bezár</button>
  </div>
</div>

<!-- VIDEO -->
<div id="videoBox" style="display:none;position:fixed;inset:0;background:black;justify-content:center;align-items:center;">
  <video width="600" controls autoplay>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<script>

const players = [
  {name:"Spudbay", avatar:"a.png", r1:10, r2:50, r3:0, cups:[]},
  {name:"SusuSzaurusz", avatar:"b.png", r1:20, r2:30, r3:0, cups:[]},
  {name:"Kata", avatar:"c.png", r1:40, r2:10, r3:0, cups:[]}
];

/* KUPA */
function recalc(){
  const sorted=[...players].sort((a,b)=>b.r2-a.r2);
  players.forEach(p=>p.cups=[]);

  if(sorted[0]) sorted[0].cups.push({type:"gold"});
  if(sorted[1]) sorted[1].cups.push({type:"silver"});

  render();
}

/* SOUND */
function playSound(){
  const a=new Audio("sound.mp3");
  a.play();
}

/* VIDEO */
function playVideo(){
  document.getElementById("videoBox").style.display="flex";
}

/* ADMIN */
const panel=document.getElementById("panel");

document.getElementById("adminBtn").onclick=()=>{
  const pass=prompt("Jelszó:");
  if(pass==="1234"){
    panel.style.display="flex";
  }else{
    alert("Hibás jelszó!");
  }
};

function closePanel(){
  panel.style.display="none";
}

/* RENDER */
function getCup(p,type){
  return p.cups.find(c=>c.type===type);
}

function render(){
  const board=document.getElementById("board");
  board.innerHTML="";

  players.sort((a,b)=>(b.r1+b.r2+b.r3)-(a.r1+a.r2+a.r3));

  players.forEach(p=>{
    board.innerHTML+=`
      <div class="row">
        <img class="avatar" src="${p.avatar}">
        <div class="name">${p.name}</div>

        <div>${p.r1}</div>
        <div>${p.r2}</div>
        <div>${p.r3}</div>

        <div class="cups">
          <div class="cup gold ${getCup(p,'gold')?'':'inactive'}">🥇</div>
          <div class="cup silver ${getCup(p,'silver')?'':'inactive'}">🥈</div>
          <div class="cup bronze inactive">🥉</div>
        </div>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
