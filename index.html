<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  display:flex;
  justify-content:center;
  padding:40px;
  color:#fff;
}

.leaderboard{
  width:800px;
  background:#222;
  padding:20px;
  border-radius:16px;
}

h2{text-align:center}

/* HEADER */
.header, .row{
  display:grid;
  grid-template-columns: 60px 1fr 80px 80px 80px 160px;
  gap:10px;
  align-items:center;
}

/* HEADER */
.header{
  font-size:12px;
  opacity:0.6;
  margin-bottom:10px;
}

/* ROW */
.row{
  background:#333;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
}

/* NAME */
.name{
  font-weight:bold;
}

/* CUPS */
.cups{
  display:flex;
  gap:6px;
}

.cup{
  padding:3px 6px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.inactive{
  opacity:0.2;
  filter:grayscale(1);
}

.gold{background:gold;color:#000;}
.silver{background:silver;color:#000;}
.bronze{background:#cd7f32;color:#000;}

/* ADMIN */
#adminBtn{
  position:fixed;
  top:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:red;
  color:#fff;
  border:none;
  cursor:pointer;
  font-size:18px;
}

#panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.box{
  background:#222;
  padding:20px;
  border-radius:10px;
  width:300px;
}

.box button{
  width:100%;
  margin:5px 0;
  padding:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<button id="adminBtn">⚙️</button>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="header">
    <div></div>
    <div>Név</div>
    <div>R1</div>
    <div>R2</div>
    <div>R3</div>
    <div>Kupák</div>
  </div>

  <div id="board"></div>
</div>

<!-- ADMIN -->
<div id="panel">
  <div class="box">
    <h3>ADMIN PANEL</h3>
    <button onclick="playSound()">🔊 Hang</button>
    <button onclick="playVideo()">🎬 Videó</button>
    <button onclick="recalc()">🏆 Kupák újraszámolása</button>
    <button onclick="closePanel()">Bezár</button>
  </div>
</div>

<!-- VIDEO -->
<div id="videoBox" style="display:none;position:fixed;inset:0;background:#000;justify-content:center;align-items:center;">
  <video width="600" controls autoplay>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<script>

/* 🔥 EZ A TE EREDETI LISTÁD */
const players = [
  { name: "On3door", avatar: "onedoor.png", round1: 134, round2: 0, round3: 0, cups: [] },
  { name: "MiszterSusu", avatar: "misztersiba.gif", round1: 134, round2: 52, round3: 0, cups: [] },
  { name: "SusuSzaurusz", avatar: "dinoori.gif", round1: 84, round2: 75, round3: 0, cups: [] },
  { name: "Spudbay", avatar: "spudbaymaci.gif", round1: 98, round2: 42, round3: 0, cups: [] },
  { name: "MrSusu", avatar: "Mrgrogu.gif", round1: 50, round2: 0, round3: 0, cups: [] }
];

/* 🏆 KUPA RENDSZER (2. forduló) */
function recalc(){
  const sorted=[...players].sort((a,b)=>b.round2-a.round2);

  players.forEach(p=>p.cups=[]);

  if(sorted[0]) sorted[0].cups.push({type:"gold"});
  if(sorted[1]) sorted[1].cups.push({type:"silver"});

  render();
}

/* 🔊 hang */
function playSound(){
  new Audio("sound.mp3").play();
}

/* 🎬 videó */
function playVideo(){
  document.getElementById("videoBox").style.display="flex";
}

/* admin panel */
const panel=document.getElementById("panel");

document.getElementById("adminBtn").onclick=()=>{
  const pass=prompt("Jelszó:");
  if(pass==="1234"){
    panel.style.display="flex";
  }else{
    alert("Hibás jelszó!");
  }
};

function closePanel(){
  panel.style.display="none";
}

/* 📊 RENDER */
function getCup(p,type){
  return p.cups.find(c=>c.type===type);
}

function render(){
  const board=document.getElementById("board");
  board.innerHTML="";

  players.sort((a,b)=>
    (b.round1+b.round2+b.round3)-(a.round1+a.round2+a.round3)
  );

  players.forEach(p=>{
    board.innerHTML+=`
      <div class="row">
        <img class="avatar" src="${p.avatar}">
        <div class="name">${p.name}</div>

        <div>${p.round1}</div>
        <div>${p.round2}</div>
        <div>${p.round3}</div>

        <div class="cups">
          <div class="cup gold ${getCup(p,'gold')?'':'inactive'}">🥇</div>
          <div class="cup silver ${getCup(p,'silver')?'':'inactive'}">🥈</div>
          <div class="cup bronze inactive">🥉</div>
        </div>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
