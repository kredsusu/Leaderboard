<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flakon Ranglista + Majom Játék</title>

<style>
/* ===============================
   OLDAL HÁTTÉR
   =============================== */
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: url('hatter.png') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

/* ===============================
   ELRENDEZÉS
   =============================== */
.page {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 30px;
  padding: 30px;
  justify-content: center;
}

.centerCol { justify-self: center; }
.rightCol  { justify-self: start; margin-left: -30px; }

/* ===============================
   LEADERBOARD (VÁLTOZATLAN)
   =============================== */
.leaderboard {
  width: 600px;
  padding: 30px;
  background: url('keret.png') no-repeat center center;
  background-size: cover;
  border-radius: 25px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
}

.leaderboard h2 {
  text-align: center;
  font-size: 36px;
  margin-bottom: 30px;
  text-shadow: 2px 2px 6px #000;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 20px;
  border: 4px solid transparent;
}

.row:nth-child(2) { border-color: gold; }
.row:nth-child(3) { border-color: silver; }
.row:nth-child(4) { border-color: #cd7f32; }

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #fff;
}

.name {
  font-size: 24px;
  font-weight: bold;
  flex: 1;
  margin-left: 15px;
}

.count {
  font-size: 22px;
  font-weight: bold;
  background: #f5f5f5;
  color: #000;
  padding: 8px 12px;
  border-radius: 12px;
}

/* ===============================
   JÁTÉK
   =============================== */
#gameWrap {
  width: 520px;
  background: rgba(0,0,0,0.45);
  border-radius: 22px;
  padding: 14px;
}

.gTop {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 10px;
}

.gPill {
  background: rgba(255,255,255,0.15);
  padding: 6px 10px;
  border-radius: 999px;
}

#gGame {
  position: relative;
  height: 300px;
  border-radius: 14px;
  overflow: hidden;
  background: url('jatekhatter.jpg') no-repeat center bottom;
  background-size: cover;
}

.gGround {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(0,0,0,0.35);
}

/* karakter */
#gPlayer {
  position: absolute;
  left: 70px;
  bottom: 52px;
  width: 90px;
  height: 90px;
  object-fit: contain;
}

/* akadályok */
.gObstacle {
  position: absolute;
  bottom: 52px;
  width: 52px;
  height: 52px;
  background-size: contain;
  background-repeat: no-repeat;
}

.gBanana { background-image: url('banana.png'); }
.gStone  { background-image: url('stone.png'); }

/* overlayk */
.gOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: grid;
  place-items: center;
}

.gModal {
  background: rgba(0,0,0,0.8);
  padding: 14px;
  border-radius: 14px;
  text-align: center;
}

#gName {
  padding: 8px;
  border-radius: 8px;
  border: none;
  font-family: inherit;
}

.gBtn {
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  margin-left: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="page">

<!-- LEADERBOARD -->
<div class="centerCol">
<div class="leaderboard">
<h2>Flakon Ranglista</h2>

<div class="row"><img class="avatar" src="onedoor.png"><div class="name">On3door</div><div class="count">65</div></div>
<div class="row"><img class="avatar" src="misztersiba.gif"><div class="name">MiszterSusu</div><div class="count">60</div></div>
<div class="row"><img class="avatar" src="dinoori.gif"><div class="name">SusuSzaurusz</div><div class="count">58</div></div>
<div class="row"><img class="avatar" src="spudbaymaci.gif"><div class="name">Spudbay</div><div class="count">55</div></div>

</div>
</div>

<!-- JÁTÉK -->
<div class="rightCol">
<div id="gameWrap">

<div class="gTop">
<div class="gPill">Játékos: <b id="uiPlayer">-</b></div>
<div class="gPill">Pont: <b id="uiScore">0</b></div>
<div class="gPill">Rekord: <b id="uiBest">-</b></div>
</div>

<div id="gGame">
<img id="gPlayer" src="majomka.png">
<div class="gGround"></div>

<div id="start" class="gOverlay">
  <div class="gModal">
    <input id="gName" placeholder="Neved">
    <button class="gBtn" onclick="startGame()">Start</button>
  </div>
</div>

<div id="over" class="gOverlay" style="display:none;">
  <div class="gModal">
    <div id="overText"></div>
    <button class="gBtn" onclick="startGame()">Újra</button>
  </div>
</div>

</div>
</div>
</div>

<script>
/* ===============================
   JÁTÉK LOGIKA – DINO STÍLUS
   =============================== */
let y=0, vy=0;
const gravity = -0.9;
const jumpV = 21;

let score=0;
let tick=0;

let speedBase = 4.0;
let speedMax  = 10.0;
let speed = speedBase;

let spawnMin = 85;
let spawnMax = 155;
let spawnTimer = 0;

let obstacles=[];
let running=false;
let playerName="";

const player=document.getElementById("gPlayer");
const game=document.getElementById("gGame");
const uiScore=document.getElementById("uiScore");
const uiPlayer=document.getElementById("uiPlayer");
const uiBest=document.getElementById("uiBest");
const over=document.getElementById("over");
const startO=document.getElementById("start");
const overText=document.getElementById("overText");

function loadBest(){
  return JSON.parse(localStorage.getItem("best")) || {name:"-",score:0};
}
function saveBest(b){ localStorage.setItem("best",JSON.stringify(b)); }
function renderBest(){
  const b=loadBest();
  uiBest.textContent=`${b.name} - ${b.score}`;
}
renderBest();

function startGame(){
  playerName=document.getElementById("gName").value||"Névtelen";
  uiPlayer.textContent=playerName;
  y=0;vy=0;score=0;tick=0;
  speed=speedBase;
  spawnMin=85;spawnMax=155;
  obstacles.forEach(o=>o.el.remove());
  obstacles=[];
  uiScore.textContent="0";
  over.style.display="none";
  startO.style.display="none";
  running=true;
  requestAnimationFrame(loop);
}

function addObstacle(){
  const el=document.createElement("div");
  el.className="gObstacle "+(Math.random()<0.5?"gBanana":"gStone");
  game.appendChild(el);
  const x=game.clientWidth+80;
  obstacles.push({el,x});
  el.style.left=x+"px";
}

function loop(){
  if(!running)return;

  vy+=gravity;
  y+=vy;
  if(y<0){y=0;vy=0;}
  player.style.transform=`translateY(${-y}px)`;

  tick++;
  if(tick%6===0){
    score++;
    uiScore.textContent=score;
    speed=Math.min(speedMax,speedBase+score*0.003);
  }

  spawnTimer++;
  const threshold=spawnMin+Math.random()*(spawnMax-spawnMin);
  if(spawnTimer>threshold){
    addObstacle();
    spawnTimer=0;
  }

  const pRect=player.getBoundingClientRect();
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.x-=speed;
    o.el.style.left=o.x+"px";
    if(o.x<-80){o.el.remove();obstacles.splice(i,1);continue;}
    if(pRect.left<o.el.getBoundingClientRect().right &&
       pRect.right>o.el.getBoundingClientRect().left &&
       pRect.bottom>o.el.getBoundingClientRect().top){
      running=false;
      const best=loadBest();
      if(score>best.score){
        saveBest({name:playerName,score});
        renderBest();
      }
      overText.innerHTML=`Pontod: ${score}`;
      over.style.display="grid";
      return;
    }
  }

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&running&&y===0)vy=jumpV;
});
game.addEventListener("pointerdown",()=>{ if(running&&y===0)vy=jumpV; });
</script>

</body>
</html>
