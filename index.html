<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}

.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.leaderboard{
  width:900px;
  max-width:95vw;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

h2{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:0 0 15px 0;
}

.grid{
  display:grid;
  grid-template-columns: 70px 1fr 90px 90px 90px 110px 140px;
  gap:10px;
  align-items:center;
}

.score-header{
  margin-bottom:10px;
  font-size:11px;
  font-weight:bold;
  color:rgba(255,255,255,0.7);
  text-align:center;
}

.row{
  background:rgba(0,0,0,.4);
  padding:12px;
  border-radius:18px;
  margin:8px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
}

.first{
  box-shadow:0 0 25px rgba(255,215,0,0.9);
  border:2px solid gold;
}

.second{
  box-shadow:0 0 20px rgba(192,192,192,0.8);
  border:2px solid silver;
}

.third{
  box-shadow:0 0 20px rgba(205,127,50,0.8);
  border:2px solid #cd7f32;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.name{
  font-size:18px;
  font-weight:900;
}

.count{
  text-align:center;
  font-size:16px;
  font-weight:900;
  padding:6px;
  border-radius:8px;
}

.old{ background:rgba(255,255,255,0.25); }
.total{ background:#4CAF50; }

.cup-column{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

.cup-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border-radius:8px;
  font-weight:900;
  font-size:12px;
}

.cup-badge.inactive{
  opacity:0.25;
  filter:grayscale(1);
}

.gold{ background:linear-gradient(180deg,#ffeb3b,#fbc02d,#f57f17); }
.silver{ background:linear-gradient(180deg,#f5f5f5,#bdbdbd,#757575); }
.bronze{ background:linear-gradient(180deg,#a1887f,#795548,#4e342e); }

#dontPressBtn{
  width:260px;
  height:90px;
  background:red;
  color:white;
  font-size:22px;
  font-weight:900;
  border:none;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,0.8);
  transition:0.2s;
}

#videoOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.videoBox{
  width:80%;
  max-width:900px;
  position:relative;
}

video{
  width:100%;
  border-radius:10px;
}

.closeBtn{
  position:absolute;
  top:-40px;
  right:0;
  background:red;
  color:white;
  border:none;
  padding:8px 12px;
  font-size:18px;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="leaderboard">
    <h2>Flakon Ranglista</h2>

    <div class="grid score-header">
      <div></div>
      <div></div>
      <div>1. forduló</div>
      <div>2. forduló</div>
      <div>3. forduló</div>
      <div>Összes</div>
      <div>Kupák</div>
    </div>

    <div id="leaderboard-content"></div>
  </div>

  <button id="dontPressBtn">NE NYOMD MEG</button>

</div>

<div id="videoOverlay">
  <div class="videoBox">
    <button class="closeBtn" onclick="closeVideo()">X</button>

    <video id="prankVideo" controls autoplay>
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>
</div>

<script>

const VIDEO_FILE = "mivan.mp4";

const players = [
  { name:"On3door", avatar:"onedoor.png", round1:134, round2:0, round3:0, cups:{gold:1,silver:0,bronze:0} },
  { name:"Puki", avatar:"puki.gif", round1:0, round2:118, round3:201, cups:{gold:0,silver:0,bronze:1} },
  { name:"MiszterSusu", avatar:"misztersiba.gif", round1:134, round2:59, round3:16, cups:{gold:1,silver:0,bronze:1} },
  { name:"SusuSzaurusz", avatar:"dingo1.gif", round1:84, round2:125, round3:0, cups:{gold:0,silver:1,bronze:1} },
  { name:"Spudbay", avatar:"spudbaymaci.gif", round1:98, round2:42, round3:47, cups:{gold:1,silver:1,bronze:0} },
  { name:"MrSusu", avatar:"Mrgrogu.gif", round1:50, round2:0, round3:0, cups:{gold:0,silver:0,bronze:0} }
];

function cupBadge(cups,type,icon){
  const count = cups[type];
  return `
    <div class="cup-badge ${type} ${count ? "" : "inactive"}">
      ${icon} x${count}
    </div>
  `;
}

function updateLeaderboard(){
  const container = document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.round1+b.round2+b.round3)-(a.round1+a.round2+a.round3)
  );

  container.innerHTML="";

  players.forEach((p,index)=>{
    let rankClass = "";
    if(index === 0) rankClass = "first";
    if(index === 1) rankClass = "second";
    if(index === 2) rankClass = "third";

    container.innerHTML += `
      <div class="grid row ${rankClass}">

        <img class="avatar" src="${p.avatar}">

        <div class="name">${p.name}</div>

        <div class="count old">${p.round1}</div>
        <div class="count old">${p.round2}</div>
        <div class="count old">${p.round3}</div>

        <div class="count total">${p.round1+p.round2+p.round3}</div>

        <div class="cup-column">
          ${cupBadge(p.cups,"gold","🏆")}
          ${cupBadge(p.cups,"silver","🥈")}
          ${cupBadge(p.cups,"bronze","🥉")}
        </div>

      </div>
    `;
  });
}

updateLeaderboard();

/* VIDEO RÉSZ - EZ VOLT A HIBA HELYE */
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("prankVideo");
const source = document.getElementById("videoSource");

document.getElementById("dontPressBtn").onclick = () => {
  overlay.style.display = "flex";
  source.src = VIDEO_FILE;
  video.load();
  video.play();
};

function closeVideo(){
  overlay.style.display = "none";
  video.pause();
  video.currentTime = 0;
}

video.onended = closeVideo;

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeVideo();
});

</script>

</body>
</html>
