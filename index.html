<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Flakon Ranglista</title>
<style>
/* ===============================
   BODY & HÁTTÉR
   =============================== */
body {
  margin: 0;
  padding: 0;
  font-family: 'Comic Sans MS', cursive;
  background: url('hatter.jpg') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

/* ===============================
   LEADERBOARD KERET
   =============================== */
.leaderboard {
  width: 600px;
  margin: 50px auto;
  padding: 30px;
  background: url('keret.png') no-repeat center center;
  background-size: cover;
  border-radius: 25px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
  position: relative;
}

/* ===============================
   FEJLÉC
   =============================== */
.leaderboard h2 {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 2px 2px 6px #000;
  margin-bottom: 30px;
}

/* ===============================
   LISTA SOROK
   =============================== */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 20px;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  border: 4px solid transparent;
  height: 90px;  /* fix magasság, így a sorok és keret nem húzódik össze */
}

/* ===============================
   KÜLÖNLEGES KERET SZÍNEK
   =============================== */
.row:nth-child(2) { border-color: gold; }
.row:nth-child(3) { border-color: silver; }
.row:nth-child(4) { border-color: #cd7f32; }

/* ===============================
   GIF / AVATAR
   =============================== */
.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 16px;
  border: 3px solid #fff;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

/* ===============================
   KÜLÖN MÉRET EGY KÉPNEK
   =============================== */
.avatar.small {
  width: 50px;   /* kisebb méret */
  height: 50px;
  margin-top: 10px;   /* extra tér, hogy ne húzza össze a keretet */
  margin-bottom: 10px;
}

/* ===============================
   NÉV
   =============================== */
.name {
  font-size: 24px;
  font-weight: bold;
  flex: 1;
  text-shadow: 2px 2px 3px #000;
}

/* ===============================
   PONTSZÁM / FLAKON
   =============================== */
.count {
  font-size: 22px;
  font-weight: bold;
  background: #f5f5f5;
  color: #000;
  padding: 8px 12px;
  border-radius: 12px;
  box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  min-width: 60px;
  text-align: center;
}
</style>
</head>
<body>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="row">
    <img class="avatar small" src="onedoor.png" alt="Avatar">
    <div class="name">On3door</div>
    <div class="count">65</div>
  </div>

  <div class="row">
    <img class="avatar" src="misztersiba.gif" alt="Avatar">
    <div class="name">MiszterSusu</div>
    <div class="count">60</div>
  </div>

  <div class="row">
    <img class="avatar" src="dinoori.gif" alt="Avatar">
    <div class="name">SusuSzaurusz</div>
    <div class="count">58</div>
  </div>

  <div class="row">
    <img class="avatar" src="spudbaymaci.gif" alt="Avatar">
    <div class="name">Spudbay</div>
    <div class="count">55</div>
  </div>

  <div class="row">
    <img class="avatar" src="Mrgrogu.gif" alt="Avatar">
    <div class="name">MrSusu</div>
    <div class="count">50</div>
  </div>

</div>

</body>
</html>
