<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Flakon leaderboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:url("hatter.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:60px;
  padding-top:40px;
  color:#fff;
}

.leaderboard{
  width:650px;
  padding:25px;
  background:url("keret.png") center/cover no-repeat;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}

.leaderboard h2{
  text-align:center;
  font-size:32px;
  font-weight:800;
  text-shadow:2px 2px 6px #000;
  margin:0 0 15px 0;
}

.score-header{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-right:14px;
  margin-bottom:8px;
}

.header-item{
  width:80px;
  text-align:center;
  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
  color:rgba(255,255,255,0.7);
  line-height:1.2;
}

#leaderboard-content{
  display:flex;
  flex-direction:column;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(0,0,0,.4);
  padding:10px 14px;
  border-radius:18px;
  margin:6px 0;
  box-shadow:2px 2px 8px rgba(0,0,0,.5);
}

/* TOP BORDER */
.row.top1{border:3px solid gold;}
.row.top2{border:3px solid silver;}
.row.top3{border:3px solid #cd7f32;}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

/* 🔥 FIX: NÉV NEM VÁGÓDIK LE */
.name-container{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.name{
  font-size:18px;
  font-weight:800;
  text-shadow:2px 2px 3px #000;
  white-space:nowrap;
  overflow:visible;   /* 🔥 FIX */
  max-width:none;     /* 🔥 FIX */
}

.cups-wrapper{
  display:flex;
  gap:6px;
  align-items:center;
  flex-shrink:0;
}

.cup-badge{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:8px;
  font-weight:900;
  font-size:14px;
  border:2px solid rgba(255,255,255,0.4);
}

.gold{background:gold;color:#000;}
.silver{background:silver;color:#000;}
.bronze{background:#cd7f32;color:#000;}

.score-group{
  display:flex;
  gap:10px;
  align-items:center;
}

.count{
  font-size:16px;
  font-weight:800;
  background:#f5f5f5;
  color:#000;
  padding:6px 0;
  border-radius:8px;
  width:80px;
  text-align:center;
}

.old{background:rgba(255,255,255,0.25);color:#fff;}
.total{background:#4CAF50;color:#fff;}

</style>
</head>

<body>

<div class="leaderboard">
  <h2>Flakon Ranglista</h2>

  <div class="score-header">
    <div class="header-item">1.<br>forduló</div>
    <div class="header-item">2.<br>forduló</div>
    <div class="header-item">3.<br>forduló</div>
    <div class="header-item" style="color:#4CAF50;">Összes</div>
  </div>

  <div id="leaderboard-content"></div>
</div>

<script>
const players = [
  { name:"On3door", avatar:"onedoor.png", oldScore:134, newScore:0, round3:0, cups:[{type:"gold",count:1}] },
  { name:"Puki", avatar:"onedoor.png", oldScore:0, newScore:118, round3:0, cups:[] },
  { name:"MiszterSusu", avatar:"misztersiba.gif", oldScore:134, newScore:59, round3:0, cups:[] },
  { name:"SusuSzaurusz", avatar:"dinoori.gif", oldScore:84, newScore:125, round3:0, cups:[{type:"silver",count:1}] },
  { name:"Spudbay", avatar:"spudbaymaci.gif", oldScore:98, newScore:198, round3:0, cups:[{type:"gold",count:1}] },
  { name:"MrSusu", avatar:"Mrgrogu.gif", oldScore:50, newScore:0, round3:0, cups:[] }
];

function updateLeaderboard(){
  const container=document.getElementById("leaderboard-content");

  players.sort((a,b)=>
    (b.oldScore+b.newScore+(b.round3||0))-
    (a.oldScore+a.newScore+(a.round3||0))
  );

  container.innerHTML="";

  players.forEach((p,i)=>{

    let cups=(p.cups||[]).map(c=>`
      <div class="cup-badge ${c.type}">
        ${c.type==="gold"?"🏆":c.type==="silver"?"🥈":"🥉"} x${c.count}
      </div>
    `).join("");

    container.innerHTML+=`
      <div class="row ${i===0?"top1":i===1?"top2":i===2?"top3":""}">
        <img class="avatar" src="${p.avatar}">

        <div class="name-container">
          <div class="name" title="${p.name}">
            ${p.name}
          </div>
          <div class="cups-wrapper">${cups}</div>
        </div>

        <div class="score-group">
          <div class="count old">${p.oldScore}</div>
          <div class="count">${p.newScore}</div>
          <div class="count">${p.round3||0}</div>
          <div class="count total">${p.oldScore+p.newScore+(p.round3||0)}</div>
        </div>
      </div>
    `;
  });
}

updateLeaderboard();
</script>

</body>
</html>
